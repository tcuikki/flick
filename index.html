<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Flick</title>
    <!--
      クリティカル CSS はインラインにして、JS を待たずに
      「スケルトン」と「メモ入力欄」を最初のペイントで出す。
    -->
    <style>
      :root {
        --bg: #f7f8fb;
        --ink: #0b0b0f;
        --ink-2: rgba(60, 60, 67, 0.6);
        --ink-3: rgba(60, 60, 67, 0.3);
        --accent: #007aff;
        --glass-fill: rgba(255, 255, 255, 0.58);
        --glass-stroke: rgba(255, 255, 255, 0.85);
        --glass-shadow: 0 10px 34px rgba(17, 24, 39, 0.1), 0 1px 3px rgba(17, 24, 39, 0.08);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
        --kb: 0px;
        --tabs-h: 58px;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
      body { overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }

      /* 背景: 白ベース + ごく淡い光だまり（ガラスの屈折が見えるように） */
      .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .ambient i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; }
      .ambient i:nth-child(1) { width: 60vmax; height: 60vmax; left: -20vmax; top: -18vmax; background: #dbe8ff; }
      .ambient i:nth-child(2) { width: 50vmax; height: 50vmax; right: -22vmax; top: 30vh; background: #ffe9f1; }
      .ambient i:nth-child(3) { width: 46vmax; height: 46vmax; left: 10vw; bottom: -26vmax; background: #e3fbef; }

      /* Liquid Glass: コントロール/ナビゲーション層だけに使う（Apple HIG Materials） */
      .glass {
        position: relative;
        background: var(--glass-fill);
        -webkit-backdrop-filter: blur(22px) saturate(190%);
        backdrop-filter: blur(22px) saturate(190%);
        box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.95), inset 0 -0.5px 0.5px rgba(0, 0, 0, 0.05),
          inset 0 0 0 0.5px var(--glass-stroke), var(--glass-shadow);
        isolation: isolate;
      }
      .glass::before { /* 上辺のスペキュラーハイライト */
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
        background: radial-gradient(120% 70% at var(--mx, 30%) -10%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 55%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0) 40%);
      }
      .glass::after { /* 縁の屈折リング */
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        padding: 1px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.05) 60%, rgba(255, 255, 255, 0.7));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
      }
      @media (prefers-reduced-transparency: reduce) {
        .glass { background: rgba(250, 250, 252, 0.97); -webkit-backdrop-filter: none; backdrop-filter: none; }
      }

      /* メモ入力欄（React より前から生きている。React はこの DOM をそのまま引き継ぐ） */
      #composer {
        position: fixed; z-index: 40; left: 12px; right: 12px;
        bottom: calc(var(--kb) + var(--safe-b) + var(--tabs-h) + 22px);
        height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 6px;
        padding: 0 6px 0 18px; margin: 0 auto; max-width: 620px;
        transition: bottom 0.28s cubic-bezier(0.2, 0.9, 0.25, 1), transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      #composer:focus-within { transform: scale(1.015); }
      #compose-input {
        flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
        font: 400 17px/1 var(--font); color: var(--ink); letter-spacing: -0.01em;
      }
      #compose-input::placeholder { color: var(--ink-3); }
      #composer-slot { display: flex; align-items: center; }

      /* 全画面スケルトン */
      #boot { position: fixed; inset: 0; z-index: 30; pointer-events: none; transition: opacity 0.45s ease, filter 0.45s ease; }
      #boot.hide { opacity: 0; filter: blur(8px); }
      .sk { background: linear-gradient(90deg, #eceef3 0%, #f6f7fa 40%, #eceef3 80%); background-size: 300% 100%; animation: sk 1.4s ease-in-out infinite; border-radius: 10px; }
      @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: -50% 0; } }
      .sk-wrap { max-width: 620px; margin: 0 auto; padding: calc(var(--safe-t) + 14px) 16px 0; }
      .sk-head { display: flex; align-items: flex-end; justify-content: space-between; height: 92px; padding-bottom: 12px; }
      .sk-card { display: flex; gap: 14px; align-items: center; height: 74px; padding: 0 16px; margin-bottom: 10px; border-radius: 22px; background: rgba(255, 255, 255, 0.75); box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05); }
      .sk-tabs { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 12px); height: var(--tabs-h); border-radius: 29px; max-width: 620px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; padding: 0 18px; }
      @media (prefers-reduced-motion: reduce) { .sk { animation: none; } #composer { transition: none; } }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

    <div id="root"></div>

    <div id="boot" aria-hidden="true" data-testid="skeleton">
      <div class="sk-wrap">
        <div class="sk-head">
          <div><div class="sk" style="width: 96px; height: 12px; margin-bottom: 12px"></div><div class="sk" style="width: 150px; height: 30px"></div></div>
          <div class="sk" style="width: 40px; height: 40px; border-radius: 50%"></div>
        </div>
        <div class="sk-card"><div class="sk" style="width: 26px; height: 26px; border-radius: 50%"></div><div style="flex: 1"><div class="sk" style="width: 70%; height: 14px; margin-bottom: 8px"></div><div class="sk" style="width: 30%; height: 10px"></div></div></div>
        <div class="sk-card"><div class="sk" style="width: 26px; height: 26px; border-radius: 50%"></div><div style="flex: 1"><div class="sk" style="width: 55%; height: 14px; margin-bottom: 8px"></div><div class="sk" style="width: 22%; height: 10px"></div></div></div>
        <div class="sk-card"><div class="sk" style="width: 26px; height: 26px; border-radius: 50%"></div><div style="flex: 1"><div class="sk" style="width: 80%; height: 14px; margin-bottom: 8px"></div><div class="sk" style="width: 26%; height: 10px"></div></div></div>
        <div class="sk-card"><div class="sk" style="width: 26px; height: 26px; border-radius: 50%"></div><div style="flex: 1"><div class="sk" style="width: 46%; height: 14px; margin-bottom: 8px"></div><div class="sk" style="width: 18%; height: 10px"></div></div></div>
        <div class="sk-card"><div class="sk" style="width: 26px; height: 26px; border-radius: 50%"></div><div style="flex: 1"><div class="sk" style="width: 64%; height: 14px; margin-bottom: 8px"></div><div class="sk" style="width: 28%; height: 10px"></div></div></div>
        <div class="sk-card"><div class="sk" style="width: 26px; height: 26px; border-radius: 50%"></div><div style="flex: 1"><div class="sk" style="width: 38%; height: 14px; margin-bottom: 8px"></div><div class="sk" style="width: 20%; height: 10px"></div></div></div>
      </div>
      <div class="sk-tabs glass">
        <div class="sk" style="width: 64px; height: 14px"></div><div class="sk" style="width: 64px; height: 14px"></div><div class="sk" style="width: 64px; height: 14px"></div>
      </div>
    </div>

    <form id="composer" class="glass" autocomplete="off" data-testid="composer">
      <input id="compose-input" name="memo" type="text" placeholder="メモ" aria-label="メモを入力"
        enterkeyhint="send" maxlength="500" autocomplete="off" autocorrect="on" autofocus data-testid="compose-input" />
      <div id="composer-slot"></div>
    </form>

    <script>
      // JS バンドルの読み込みを待たずにメモを受け付けるためのブートスクリプト。
      // React が起動したら window.__flickAdd を差し替え、溜まったメモを取り込む。
      (function () {
        var form = document.getElementById("composer");
        var input = document.getElementById("compose-input");
        var Q = "flick:boot-queue", D = "flick:draft";
        try { input.value = localStorage.getItem(D) || ""; } catch (e) {}
        window.__flickQueue = (function () { try { return JSON.parse(localStorage.getItem(Q) || "[]"); } catch (e) { return []; } })();
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var v = input.value.trim();
          if (!v) return;
          input.value = "";
          try { localStorage.removeItem(D); } catch (e) {}
          if (window.__flickAdd) return window.__flickAdd(v);
          window.__flickQueue.push({ text: v, at: Date.now() });
          try { localStorage.setItem(Q, JSON.stringify(window.__flickQueue)); } catch (e) {}
          form.animate && form.animate([{ transform: "scale(0.97)" }, { transform: "scale(1)" }], { duration: 260, easing: "cubic-bezier(.2,.9,.25,1.2)" });
        });
        input.addEventListener("input", function () { try { localStorage.setItem(D, input.value); } catch (e) {} });
        // iOS のソフトウェアキーボードぶん入力欄を持ち上げる
        var vv = window.visualViewport;
        if (vv) {
          var fit = function () {
            var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            document.documentElement.style.setProperty("--kb", (kb > 60 ? kb - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-b")) || 0) - 64 : 0) + "px");
          };
          vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit();
        }
        // 入力欄のハイライトを指の位置に追従させる
        form.addEventListener("pointermove", function (e) {
          var r = form.getBoundingClientRect();
          form.style.setProperty("--mx", ((e.clientX - r.left) / r.width) * 100 + "%");
        });
        if (!("ontouchstart" in window)) try { input.focus({ preventScroll: true }); } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
